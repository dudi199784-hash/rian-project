<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rian · Prompt Community (Full + ChatKit Integrated)</title>

  <!-- ChatKit MUST be loaded FIRST (async 금지) -->
  <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>

  <style>
    :root {
      --bg: #0b0f14;
      --text: #e6f1ff;
      --muted: #98a2b3;
      --accent: #7c3aed;
      --accent2: #22d3ee;
      --panel: #0f1722;
      --shadow: 0 10px 30px rgba(0,0,0,.3);
      --border: rgba(255,255,255,.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background:
        radial-gradient(800px 700px at 30% -10%, rgba(124,58,237,.12), transparent),
        radial-gradient(800px 600px at 70% 0%, rgba(34,211,238,.12), transparent),
        linear-gradient(180deg, #0b0f14, #0f1622);
      font-family: Pretendard, -apple-system, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(to bottom, rgba(10,14,20,.92), rgba(10,14,20,.7));
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      height: 72px; max-width: 1260px; margin: 0 auto; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-weight: 800; font-size: 24px; color: var(--text); text-decoration: none; }

    .btn {
      border: 1px solid var(--border); background: #1b2233; color: var(--text);
      padding: 10px 18px; border-radius: 999px; cursor: pointer;
      transition: transform .2s ease, box-shadow .25s ease;
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.45); }

    .hero { text-align: center; padding: 120px 20px 50px; }
    .hero-title { font-size: 66px; font-weight: 700; min-height: 84px; margin-bottom: 20px; }
    .cursor { display: inline-block; width: 3px; background: var(--accent2); margin-left: 4px; animation: blink 1s steps(2) infinite; }

    @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

    .hero-sub { color: var(--muted); margin: 10px 0 24px; }
    .prompt-bar {
      display: grid; grid-template-columns: 1fr auto; gap: 10px;
      max-width: 740px; margin: 0 auto 28px; padding: 8px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border); border-radius: 999px;
    }
    .prompt-bar input { background: none; border: none; color: var(--text); padding: 14px 18px; font-size: 17px; }

    /* MANY STYLE SECTIONS REMOVED? NO. EVERYTHING BELOW IS FULL VERSION */
    /* ———————————————— 아래 전체 스타일 전부 유지 ———————————————— */

    .brand-mini { overflow: hidden; max-width: 640px; margin: 40px auto; }
    .mini-track { display: flex; gap: 40px; white-space: nowrap; animation: miniSlide 20s linear infinite; }
    .mini-track span { font-weight: 600; color: var(--muted); font-size: 18px; }
    @keyframes miniSlide { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    .section { padding: 80px 28px; }
    .section-title { text-align: center; font-size: 34px; margin-bottom: 36px; }

    .scroll-gallery { display: flex; gap: 28px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
    .scroll-gallery::-webkit-scrollbar { display: none; }

    .card { min-width: 360px; background: #111a2b; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .card img { width: 100%; height: 320px; object-fit: cover; }

    /* SUNO BOARD */
    #suno-board { padding: 100px 40px; text-align: center; }
    #suno-board .section-title { font-size: 42px; color: #fff; margin-bottom: 60px; }
    .music-grid { display: flex; gap: 28px; justify-content: center; overflow-x: auto; white-space: nowrap; }
    .music-grid::-webkit-scrollbar { display: none; }

    .music-card { width: 260px; background: var(--panel); border-radius: 16px; box-shadow:0 8px 20px rgba(0,0,0,.4); }

    .music-thumb { position: relative; width:100%; aspect-ratio:3/4.2; overflow:hidden; }
    .music-thumb img { width:100%; height:100%; object-fit:cover; }

    .overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.6),transparent 70%); opacity:0; transition:.25s; padding:10px; display:flex; flex-direction:column; justify-content:space-between; }
    .music-thumb:hover .overlay { opacity:1; }

    .play-btn {
      background:none; border:0; width:32px; height:32px; color:white;
      font-size:20px; cursor:pointer;
    }

    .stats { display:flex; justify-content:space-between; font-size:13px; color:#ddd; background:rgba(0,0,0,.4); border-radius:10px; padding:4px 8px; }

    .music-info { padding:14px; text-align:left; }
    .music-info .title { color:white; font-size:15px; font-weight:600; }

    /* PROMPT GRID */
    .prompt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:48px; max-width:1680px; margin:0 auto; }
    .prompt-grid .card { width:520px; border-radius:16px; }

    @media(max-width:1400px) {
      .prompt-grid { grid-template-columns:repeat(2,1fr); }
      .prompt-grid .card { width:460px; }
    }

    /* MIDJOURNEY VERTICAL BOARD */
    #midjourney-board { padding:100px 40px; text-align:center; }
    #midjourney-board .section-title { font-size:42px; color:#fff; margin-bottom:60px; }

    .vertical-gallery { display:flex; gap:24px; overflow-x:auto; padding:10px; }
    .vertical-gallery::-webkit-scrollbar { display:none; }

    .vertical-card { width:260px; background:var(--panel); border-radius:22px; box-shadow:0 8px 24px rgba(0,0,0,.4); }

    footer { border-top:1px solid var(--border); background:#0a0f17; padding:60px 28px 40px; text-align:center; }
    .footer-brand { font-size:28px; font-weight:800; background:linear-gradient(90deg,#ff7a59,#8c65f7,#22d3ee,#ff7a59); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:aurora 6s linear infinite; }
    @keyframes aurora { 0%{background-position:0% 50%} 100%{background-position:100% 50%} }

  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="brand" href="#">Rian</a>
    <div class="auth">
      <button class="btn">Sign In</button>
      <button class="btn primary">Sign Up</button>
    </div>
  </div>
</header>


<section class="hero">
  <h1 class="hero-title" id="typed-text"></h1><span class="cursor"></span>
  <p class="hero-sub">프롬프트를 입력하고 AI 모델에 맞는 형태로 자동 가공해보세요.</p>

  <form class="prompt-bar" onsubmit="return false;">
    <input id="inputMessage" type="text" placeholder="당신의 아이디어를 입력하세요" />
    <button class="btn" onclick="handleSend()">Create</button>
  </form>
</section>

<!-- Chatbox -->
<div id="chatbox" style="padding:20px;background:#eee;width:400px;margin:20px auto;border-radius:10px;">
  <div id="messages" style="height:200px;overflow-y:auto;background:white;padding:10px;border-radius:8px;border:1px solid #ddd;"></div>
  <button onclick="handleSend()" class="btn" style="margin-top:10px;">Send</button>
</div>


<script>
/* Typing effect */
const phrases = [
  "ChatGPT · Gemini · Claude 최적화 프롬프트",
  "AI 프롬프트를 더 스마트하게",
  "당신의 아이디어를 현실로"
];
let i=0,j=0,deleting=false;
const el=document.getElementById("typed-text");

function tick(){
  const current=phrases[i%phrases.length];
  if(!deleting){
    el.textContent=current.slice(0,++j);
    if(j===current.length){ deleting=true; setTimeout(tick,1200); return; }
  } else {
    el.textContent=current.slice(0,--j);
    if(j===0){ deleting=false; i++; }
  }
  setTimeout(tick,deleting?40:70);
}
tick();
</script>

<script>
/* ChatKit 초기화 + agent 실행 */
window.addEventListener("load", () => {

  console.log("ChatKit loaded?", typeof ChatKit);

  const chat = new ChatKit({
      domain: "dudi199784-hash.github.io",
      publicKey: "domain_pk_6919af7eedd481959663e4ca01fd496a0d6733c65161f49f"
  });

  window.sendToAgent = async function(message) {
      try {
          const res = await chat.runWorkflow({
              workflowId: "wf_6919a9f5fe648190a32005f7b0ef106408d8932bcc9912c1",
              version: "draft",
              input: { message }
          });
          return res.output;
      } catch (e) {
          console.error(e);
          return "❌ 오류 발생";
      }
  };

});

/* 메시지 전송 */
async function handleSend() {
    const input = document.getElementById("inputMessage");
    const msg = input.value.trim();
    if(!msg) return;

    const box = document.getElementById("messages");
    box.innerHTML += `<div><b>You:</b> ${msg}</div>`;

    const reply = await sendToAgent(msg);
    box.innerHTML += `<div><b>Agent:</b> ${reply}</div>`;

    input.value="";
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
